<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/><title>Reset your ACEA password</title>
  <style>
    body{margin:0;padding:0;font-family:Inter,Arial,sans-serif;background:#040709;color:#fff}
    .wrapper{max-width:580px;margin:40px auto;background:#0A0F2E;border-radius:16px;border:1px solid rgba(239,68,68,.2);overflow:hidden}
    .header{background:linear-gradient(135deg,#EF4444,#7C2FE8);padding:36px;text-align:center}
    .header h1{margin:0;font-size:28px;font-weight:800;color:#fff}
    .body{padding:40px}
    .body p{color:#CED4DA;line-height:1.7;margin:0 0 20px}
    .btn{display:inline-block;background:linear-gradient(135deg,#7C2FE8,#00C4DB);color:#fff!important;text-decoration:none;padding:14px 32px;border-radius:10px;font-weight:700;font-size:16px}
    .note{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:16px;font-size:13px;color:#868E96}
    .footer{text-align:center;padding:24px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:#495057}
  </style>
</head>
<body>
<div class="wrapper">
  <div class="header"><h1>🔐 Password Reset</h1></div>
  <div class="body">
    <p>Hi <strong th:text="${firstName}">User</strong>,</p>
    <p>We received a request to reset your ACEA account password. Click the button below to set a new password:</p>
    <div style="text-align:center;margin:28px 0">
      <a th:href="${resetLink}" class="btn">Reset My Password</a>
    </div>
    <div class="note">
      ⏱ This link expires in <strong th:text="${expiryHours}">2</strong> hours.<br/>
      If you did not request a password reset, please ignore this email — your account is safe.
    </div>
  </div>
  <div class="footer">ACEA Platform © 2026</div>
</div>
</body>
</html>
